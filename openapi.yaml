openapi: 3.0.3
info:
  title: Countersign
  version: 0.1.0
  description: >-
    Decision-level exposure and supervision register for licensed professions. Countersign
    records which professional judgments a machine may produce, who may countersign each
    one, whether that countersignature is meaningful or nominal, how much training-grade
    work is reserved for supervised trainees, and what liability and capability exposure
    the resulting mix creates.
  x-product-slug: ai-hr-countersign
  x-source: ai-in-hr/Accenture-How-Will-AI-Impact-The-Workforce-Transcript/
servers:
  - url: https://api.example.com
tags:
  - name: Professions
    description: Professions, decision types, scope and supervision rules
  - name: Exposure
    description: Machine producibility and attributability assessment per decision type
  - name: Countersignature
    description: Decision routing, countersignature capture, amendments and release
  - name: Supervision
    description: Supervision quality analytics, re-review sampling and capacity forecasting
  - name: TrainingPipeline
    description: Reserved training-grade quotas and trainee progression
  - name: Capability
    description: Licensed hour composition, capability gaps and curriculum feedback
  - name: Liability
    description: Indemnity exposure, suspension and fallback capacity
  - name: Attestation
    description: Regulator and professional body attestations
  - name: Reporting
    description: Aggregate supervision, throughput and exposure reporting
paths:
  /v1/professions:
    get:
      operationId: listProfessions
      tags: [Professions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Professions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeProfession"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProfession
      tags: [Professions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionCreate"
      responses:
        "201":
          description: Profession registered with its regulator and standards reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProfession"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/decision-types:
    get:
      operationId: listDecisionTypes
      tags: [Professions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: professionId
          in: query
          schema:
            type: string
        - name: releaseState
          in: query
          schema:
            type: string
            enum: [human_only, automated_release_permitted, suspended]
      responses:
        "200":
          description: Decision types page with licensure and supervision rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDecisionType"
    post:
      operationId: registerDecisionType
      tags: [Professions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionTypeCreate"
      responses:
        "201":
          description: Decision type registered in human-only state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionType"
  /v1/decision-types/{decisionTypeId}/countersign-policy:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    put:
      operationId: setCountersignPolicy
      tags: [Professions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignPolicy"
      responses:
        "200":
          description: Countersignature policy and thresholds set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCountersignPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/decision-types/{decisionTypeId}/exposure-assessment:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    post:
      operationId: recordExposureAssessment
      tags: [Exposure]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExposureAssessmentCreate"
      responses:
        "201":
          description: Evidenced producibility and attributability assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExposureAssessment"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      operationId: getExposureAssessment
      tags: [Exposure]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current assessment with review cadence and history pointer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExposureAssessment"
  /v1/decisions:
    post:
      operationId: createDecisionInstance
      tags: [Countersignature]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInstanceCreate"
      responses:
        "201":
          description: Decision instance created and routed to an eligible signatory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionInstance"
        "409":
          description: Automated release for this decision type is suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listDecisionInstances
      tags: [Countersignature]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: decisionTypeId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [awaiting_countersign, countersigned, amended, refused, released, withdrawn]
      responses:
        "200":
          description: Decision instances page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDecisionInstance"
  /v1/decisions/{decisionId}/countersignature:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: recordCountersignature
      tags: [Countersignature]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignEventCreate"
      responses:
        "201":
          description: Countersignature recorded with dwell time and material reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCountersignEvent"
        "403":
          description: Signatory is not licensed or in scope for this decision type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Signatory countersignature load limit reached for this period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/decisions/{decisionId}/amendment:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: recordAmendment
      tags: [Countersignature]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendmentRecordCreate"
      responses:
        "201":
          description: Amendment or refusal recorded as model quality feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAmendmentRecord"
  /v1/decisions/{decisionId}/disclosure:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: recordDisclosure
      tags: [Countersignature]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisclosureRecord"
      responses:
        "201":
          description: Disclosure to the patient or client recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDisclosureRecord"
  /v1/re-review-samples:
    post:
      operationId: requestReReviewSample
      tags: [Supervision]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReReviewSampleRequest"
      responses:
        "201":
          description: Independent re-review sample drawn and assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReReviewSample"
  /v1/re-review-samples/{sampleId}/outcome:
    parameters:
      - $ref: "#/components/parameters/SampleId"
    post:
      operationId: submitReReviewOutcome
      tags: [Supervision]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concordance]
              properties:
                concordance:
                  type: string
                  enum: [concordant, minor_discordance, material_discordance]
                narrative:
                  type: string
                harmPotential:
                  type: string
                  enum: [none, low, moderate, severe]
      responses:
        "200":
          description: Concordance recorded and fed into supervision quality analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReReviewSample"
  /v1/supervision-quality:
    get:
      operationId: getSupervisionQuality
      tags: [Supervision]
      security:
        - BearerAuth: []
      parameters:
        - name: decisionTypeId
          in: query
          schema:
            type: string
        - name: serviceId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q3
      responses:
        "200":
          description: Dwell distribution, override rate and nominal supervision flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSupervisionQuality"
  /v1/supervision-capacity-forecast:
    get:
      operationId: getSupervisionCapacityForecast
      tags: [Supervision]
      security:
        - BearerAuth: []
      parameters:
        - name: serviceId
          in: query
          schema:
            type: string
        - name: rosterPeriod
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Forecast countersignature load against rostered supervisor capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSupervisionCapacityForecast"
  /v1/training-quotas:
    get:
      operationId: listTrainingQuotas
      tags: [TrainingPipeline]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [on_track, at_risk, breached]
      responses:
        "200":
          description: Training quotas page with consumption against reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTrainingQuota"
    post:
      operationId: setTrainingQuota
      tags: [TrainingPipeline]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuotaCreate"
      responses:
        "201":
          description: Quota reserved and automation throttling enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTrainingQuota"
  /v1/capability-plan:
    get:
      operationId: getCapabilityPlan
      tags: [Capability]
      security:
        - BearerAuth: []
      parameters:
        - name: professionId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Licensed hour composition by producibility class with gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapabilityPlan"
  /v1/curriculum-gaps:
    post:
      operationId: publishCurriculumGap
      tags: [Capability]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumGap"
      responses:
        "201":
          description: Gap published to training programme and education partners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCurriculumGap"
  /v1/decision-types/{decisionTypeId}/suspension:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    post:
      operationId: suspendAutomatedRelease
      tags: [Liability]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspensionEventCreate"
      responses:
        "202":
          description: Automated release suspended and human fallback activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSuspensionEvent"
  /v1/indemnity-exposure:
    get:
      operationId: getIndemnityExposure
      tags: [Liability]
      security:
        - BearerAuth: []
      parameters:
        - name: professionId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exposure by decision type and machine assistance level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIndemnityExposure"
  /v1/attestations:
    post:
      operationId: issueRegulatorAttestation
      tags: [Attestation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatorAttestationCreate"
      responses:
        "201":
          description: Attestation issued from supervision and release evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegulatorAttestation"
  /v1/reports/throughput-and-quality:
    get:
      operationId: getThroughputAndQualityReport
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: professionId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Supervised throughput against concordance and exposure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeThroughputQualityReport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DecisionTypeId:
      name: decisionTypeId
      in: path
      required: true
      schema:
        type: string
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
    SampleId:
      name: sampleId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: GBP
    Profession:
      type: object
      required: [id, name, regulator, jurisdiction]
      properties:
        id:
          type: string
        name:
          type: string
          example: Diagnostic radiology
        regulator:
          type: string
        jurisdiction:
          type: string
        standardsReference:
          type: string
        revalidationCycleMonths:
          type: integer
        licensedHeadcount:
          type: integer
    ProfessionCreate:
      type: object
      required: [name, regulator, jurisdiction]
      properties:
        name:
          type: string
        regulator:
          type: string
        jurisdiction:
          type: string
        standardsReference:
          type: string
        revalidationCycleMonths:
          type: integer
    ScopeRule:
      type: object
      required: [permittedSignatoryGrades]
      properties:
        permittedSignatoryGrades:
          type: array
          items:
            type: string
        delegationPermitted:
          type: boolean
        conditions:
          type: string
        statuteOrStandardReference:
          type: string
    SupervisionRule:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct, same_shift_available, remote_available, retrospective_review_only]
        maxSuperviseesPerSupervisor:
          type: integer
        minimumReviewMinutes:
          type: number
          format: float
        standardReference:
          type: string
    DecisionType:
      type: object
      required: [id, professionId, name, releaseState, liabilityOwner]
      properties:
        id:
          type: string
        professionId:
          type: string
        name:
          type: string
          example: Plain film chest report
        annualVolume:
          type: integer
        releaseState:
          type: string
          enum: [human_only, automated_release_permitted, suspended]
        liabilityOwner:
          type: string
          enum: [individual_signatory, employing_organisation, shared]
        scopeRule:
          $ref: "#/components/schemas/ScopeRule"
        supervisionRule:
          $ref: "#/components/schemas/SupervisionRule"
        disclosureRequired:
          type: boolean
        trainingGrade:
          type: boolean
          description: Whether this decision type is part of the qualification pathway
    DecisionTypeCreate:
      type: object
      required: [professionId, name, liabilityOwner]
      properties:
        professionId:
          type: string
        name:
          type: string
        annualVolume:
          type: integer
        liabilityOwner:
          type: string
          enum: [individual_signatory, employing_organisation, shared]
        scopeRule:
          $ref: "#/components/schemas/ScopeRule"
        supervisionRule:
          $ref: "#/components/schemas/SupervisionRule"
        disclosureRequired:
          type: boolean
        trainingGrade:
          type: boolean
    ExposureAssessment:
      type: object
      required: [decisionTypeId, producibility, attributability, assessedOn, evidence]
      properties:
        decisionTypeId:
          type: string
        producibility:
          type: string
          enum: [not_producible, partially_producible, substantially_producible, fully_producible]
        producibilityConfidence:
          type: number
          format: float
        attributability:
          type: string
          enum: [human_signature_mandatory, human_countersignature_sufficient, machine_attributable_with_disclosure]
        assessedOn:
          type: string
          format: date
        assessedBy:
          type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [internal_validation, published_study, vendor_claim, regulator_guidance, peer_consensus]
              reference:
                type: string
              strength:
                type: string
                enum: [strong, moderate, weak]
        nextReviewOn:
          type: string
          format: date
        individualUseProhibited:
          type: boolean
          default: true
          description: Assessment may never be applied to an individual professional
    ExposureAssessmentCreate:
      type: object
      required: [producibility, attributability, evidence]
      properties:
        producibility:
          type: string
          enum: [not_producible, partially_producible, substantially_producible, fully_producible]
        producibilityConfidence:
          type: number
          format: float
        attributability:
          type: string
          enum: [human_signature_mandatory, human_countersignature_sufficient, machine_attributable_with_disclosure]
        evidence:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              reference:
                type: string
              strength:
                type: string
        nextReviewOn:
          type: string
          format: date
    CountersignPolicy:
      type: object
      required: [decisionTypeId, materialToReview, minimumDwellSeconds]
      properties:
        decisionTypeId:
          type: string
        materialToReview:
          type: array
          items:
            type: string
            example: source_images
        minimumDwellSeconds:
          type: integer
        maxCountersignsPerSessionHour:
          type: integer
        reReviewSampleRatePercent:
          type: number
          format: float
        nominalSupervisionDwellFloorSeconds:
          type: integer
        suspensionThresholds:
          type: object
          properties:
            materialDiscordanceRatePercent:
              type: number
              format: float
            nominalSupervisionSharePercent:
              type: number
              format: float
    ModelContribution:
      type: object
      required: [modelName, modelVersion, contributionType]
      properties:
        modelName:
          type: string
        modelVersion:
          type: string
        contributionType:
          type: string
          enum: [full_draft, ranked_options, flag_only, measurement_only]
        confidence:
          type: number
          format: float
        uncertaintyNotes:
          type: string
        deviceClassification:
          type: string
          description: Regulatory device class where the tool is a regulated medical device
    DecisionInstance:
      type: object
      required: [id, decisionTypeId, state, createdAt]
      properties:
        id:
          type: string
        decisionTypeId:
          type: string
        subjectRef:
          type: string
          description: Pseudonymous patient or client reference, content stays in system of record
        state:
          type: string
          enum: [awaiting_countersign, countersigned, amended, refused, released, withdrawn]
        createdAt:
          type: string
          format: date-time
        modelContribution:
          $ref: "#/components/schemas/ModelContribution"
        guidelineVersion:
          type: string
        routedToSignatoryRef:
          type: string
        trainingGradeReservedFor:
          type: string
          description: Trainee reference where the instance is reserved under quota
        releasedAt:
          type: string
          format: date-time
    DecisionInstanceCreate:
      type: object
      required: [decisionTypeId, subjectRef]
      properties:
        decisionTypeId:
          type: string
        subjectRef:
          type: string
        modelContribution:
          $ref: "#/components/schemas/ModelContribution"
        guidelineVersion:
          type: string
        urgency:
          type: string
          enum: [routine, urgent, immediate]
    CountersignEvent:
      type: object
      required: [id, decisionId, signatoryRef, signedAt, dwellSeconds, outcome]
      properties:
        id:
          type: string
        decisionId:
          type: string
        signatoryRef:
          type: string
        signatoryGrade:
          type: string
        licenceVerifiedAt:
          type: string
          format: date-time
        signedAt:
          type: string
          format: date-time
        dwellSeconds:
          type: integer
        materialReviewed:
          type: array
          items:
            type: string
        outcome:
          type: string
          enum: [adopted_unchanged, adopted_with_amendment, refused, escalated]
        belowDwellFloor:
          type: boolean
    CountersignEventCreate:
      type: object
      required: [signatoryRef, dwellSeconds, materialReviewed, outcome]
      properties:
        signatoryRef:
          type: string
        dwellSeconds:
          type: integer
        materialReviewed:
          type: array
          items:
            type: string
        outcome:
          type: string
          enum: [adopted_unchanged, adopted_with_amendment, refused, escalated]
    AmendmentRecord:
      type: object
      required: [id, decisionId, category, narrative]
      properties:
        id:
          type: string
        decisionId:
          type: string
        category:
          type: string
          enum: [factual_error, omission, wrong_guideline, overcall, undercall, tone_or_framing, scope_exceeded]
        narrative:
          type: string
        materialToOutcome:
          type: boolean
        routedAsModelFeedback:
          type: boolean
    AmendmentRecordCreate:
      type: object
      required: [category, narrative, materialToOutcome]
      properties:
        category:
          type: string
          enum: [factual_error, omission, wrong_guideline, overcall, undercall, tone_or_framing, scope_exceeded]
